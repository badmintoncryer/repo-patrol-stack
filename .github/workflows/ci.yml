name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint - all categories)
        run: npm run lint:ci

      - name: Format check (oxfmt)
        run: npm run fmt:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: CDK synth validation
        run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: "ap-northeast-1"
